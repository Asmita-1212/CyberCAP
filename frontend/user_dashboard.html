<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - CyberCAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      color: #fff;
    }

    /* Navbar */
    nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #000;
      color: white;
      padding: 15px 50px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #56c5f8;
    }

    .dashboard-container {
      margin-top: 120px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dashboard-container h2 {
      font-size: 28px;
      color: #fff;
      margin-bottom: 15px;
      text-align: center;
    }

    .welcome-message {
      font-size: 18px;
      color: #f0f0f0;
      margin-bottom: 30px;
      text-align: center;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: white;
      color: #2c3e50;
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #1f3b73;
    }

    .card p {
      font-size: 14px;
      color: #555;
    }

    .logout-btn {
      margin-top: 40px;
      background: #000;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background: #2b4ae0;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        padding: 10px 20px;
      }

      .card {
        padding: 30px 15px;
      }

      .dashboard-container h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">CyberCAP</div>
   
  </nav>

  <!-- Dashboard -->
  <div class="dashboard-container">
    <h2>User Dashboard</h2>
    <p class="welcome-message" id="welcomeText">Welcome to your dashboard 👋</p>

    <div class="card-grid">
      <div class="card" onclick="location.href='complaint.html'">
        <h3>📝 Register Complaint</h3>
        <p>Report a cybercrime incident quickly and securely.</p>
      </div>

      <div class="card" onclick="location.href='trackcomplaint.html'">
        <h3>🔍 Track Complaint</h3>
        <p>Check the current status of your submitted complaints.</p>
      </div>

      <div class="card" onclick="location.href='reportsuspect.html'">
        <h3>🚨 Report Suspicious Activity</h3>
        <p>Help us stop cybercrimes by reporting suspicious behavior.</p>
      </div>
    </div>

    <button class="logout-btn" onclick="logoutUser()">🚪 Log Out</button>
  </div>

  <script>
    // Retrieve username from localStorage or fallback
    const username = localStorage.getItem("username") || "User";

    // Display personalized welcome message
    document.getElementById("welcomeText").innerText = `Welcome, ${username} — to your dashboard 👋`;

    // Logout function (redirects back to dashboard)
    function logoutUser() {
      localStorage.removeItem("username");
      window.location.href = "dashboard.html"; // stay on dashboard after logout
    }
  </script>

</body>
</html>
