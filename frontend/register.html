<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CyberCAP</title>
</head>
<body>
    <h2>Create a New Account</h2>
    <form id="registerForm">
        <label for="username">Full Name:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();  // stop page refresh

            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://127.0.0.1:8000/register", {   // ✅ correct endpoint
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById("message").innerText = "✅ Registration successful!";
                } else {
                    document.getElementById("message").innerText = "❌ " + data.detail;
                }
            } catch (error) {
                document.getElementById("message").innerText = "⚠️ Error connecting to server.";
            }
        });
    </script>
</body>
</html>
