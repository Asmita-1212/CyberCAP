<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - CyberCAP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .login-box {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      animation: fadeSlideDown 1s ease forwards;
      opacity: 0;
      transform: translateY(-30px);
    }

    @keyframes fadeSlideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f3b73;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      border-color: #3e64ff;
      box-shadow: 0 0 8px rgba(62, 100, 255, 0.3);
      outline: none;
    }

    button {
      padding: 12px;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    button:hover {
      background-color: #2b4ae0;
    }

    button:active {
      transform: scale(0.97);
    }

    a {
      text-align: center;
      margin-top: 15px;
      color: #3e64ff;
      font-size: 14px;
      text-decoration: none;
      opacity: 0;
      animation: fadeIn 1.8s ease forwards;
      animation-delay: 0.5s;
    }

    a:hover {
      text-decoration: underline;
    }

    #loginMessage {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>

    <p id="loginMessage"></p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required placeholder="Enter your username"/>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Enter your password"/>

      <button type="submit">Login</button>

      <a href="forgot_password.html">Forgot Password?</a>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const messageEl = document.getElementById("loginMessage");

      try {
        const response = await fetch("http://127.0.0.1:8000/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok) {
          messageEl.style.color = "green";
          messageEl.innerText = "✅ Admin login successful!";
          messageEl.style.display = "block";

          // Store admin data if needed
          localStorage.setItem("adminUsername", data.user.username);

          // Redirect to admin dashboard
          setTimeout(() => {
            window.location.href = "admin_dashboard.html";
          }, 1000);
        } else {
          messageEl.style.color = "red";
          messageEl.innerText = data.detail || "Invalid admin credentials";
          messageEl.style.display = "block";
        }
      } catch (error) {
        messageEl.style.color = "red";
        messageEl.innerText = "⚠️ Error connecting to server.";
        messageEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
