<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CyberCAP</title>
</head>
<body>
    <h2>Forgot Password</h2>

    <!-- Step 1: Enter Email -->
    <form id="forgotForm">
        <label for="email">Enter your registered Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <button type="submit">Send OTP</button>
    </form>

    <!-- Step 2: Enter OTP & Reset Password -->
    <form id="resetForm" style="display:none;">
        <label for="otp">Enter OTP:</label><br>
        <input type="text" id="otp" name="otp" required><br><br>

        <label for="newPassword">Enter New Password:</label><br>
        <input type="password" id="newPassword" name="newPassword" required><br><br>

        <button type="submit">Reset Password</button>
    </form>

    <p id="message"></p>

    <script>
        let userEmail = "";

        // Step 1: Send OTP
        document.getElementById("forgotForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            userEmail = document.getElementById("email").value;

            try {
                const response = await fetch("http://127.0.0.1:8000/send-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById("message").innerText = "✅ OTP sent to your email!";
                    document.getElementById("forgotForm").style.display = "none";
                    document.getElementById("resetForm").style.display = "block";
                } else {
                    document.getElementById("message").innerText = "❌ " + data.detail;
                }
            } catch (error) {
                document.getElementById("message").innerText = "⚠️ Error connecting to server.";
            }
        });

        // Step 2: Reset Password with OTP
        document.getElementById("resetForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const otp = document.getElementById("otp").value;
            const newPassword = document.getElementById("newPassword").value;

            try {
                const response = await fetch("http://127.0.0.1:8000/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: userEmail, otp, new_password: newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById("message").innerText = data.message+" You can now login.";
                    document.getElementById("resetForm").reset();
                } else {
                    document.getElementById("message").innerText = "❌ " + data.detail;
                }
            } catch (error) {
                document.getElementById("message").innerText = "⚠️ Error connecting to server.";
            }
        });
    </script>
</body>
</html>
