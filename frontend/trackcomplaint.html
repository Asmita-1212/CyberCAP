<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Your Cybercrime Complaint - CyberCAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset and Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #5fa8f1;
      padding: 0;
      margin: 0;
    }

    /* Navbar */
    nav {
      background-color: #000;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    nav .logo {
      color: white;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: color 0.3s ease;
      padding-bottom: 2px;
    }

    nav ul li a:hover {
      color: #56c5f8;
    }

    nav ul li a.active {
      color: #56c5f8;
      border-bottom: 2px solid #56c5f8;
    }

    /* Container */
    .container {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #1f3b73;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button[type="submit"] {
      margin-top: 30px;
      width: 100%;
      background-color: #3e64ff;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
      background-color: #2b4ae0;
    }

    #result {
      margin-top: 30px;
      display: none;
      background-color: #e9f7ef;
      border: 1px solid #c3e6cb;
      padding: 18px;
      border-radius: 6px;
      color: #155724;
      transition: all 0.3s ease;
    }

    .loading {
      text-align: center;
      margin-top: 20px;
      display: none;
      color: #3e64ff;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
      }

      .container {
        padding: 25px;
        margin: 40px 15px;
      }

      input, button {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">CyberCAP</div>
    <ul>
      <li><a href="user_dashboard.html">Home</a></li>
      <li><a href="complaint.html">Register Complaint</a></li>
      <li><a href="trackcomplaint.html" class="active">Track Complaint</a></li>
      <li><a href="reportsuspect.html">Report Suspect</a></li>
      <li><a href="#" onclick="logoutUser()">Logout</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <h2>🔍 Track Your Complaint</h2>

    <form id="trackForm">
      <label for="complaintId">Complaint ID:</label>
      <input type="text" id="complaintId" name="complaintId" required placeholder="Enter your Complaint ID">

      <label for="mobile">Registered Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" required placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10">

      <button type="submit">Track Complaint</button>
    </form>

    <div class="loading" id="loading">Fetching your complaint status...</div>

    <div id="result"></div>
  </div>

  <script>
    // ✅ Track Complaint Logic
    document.getElementById('trackForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      document.getElementById('result').style.display = 'none';
      const loading = document.getElementById('loading');
      loading.style.display = 'block';

      const complaint_id = document.getElementById('complaintId').value.trim();
      const mobile = document.getElementById('mobile').value.trim();

      try {
        const response = await fetch("http://127.0.0.1:8000/track_complaint", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ complaint_id, mobile })
        });

        loading.style.display = 'none';

        const data = await response.json();

        if (!response.ok) {
          document.getElementById('result').innerHTML = `<strong>Error:</strong> ${data.detail || "Invalid Complaint ID or Mobile Number."}`;
          document.getElementById('result').style.display = 'block';
          return;
        }

        document.getElementById('result').innerHTML = `
          <strong>Status:</strong> ${data.status || "Pending"}<br>
          <strong>Complaint ID:</strong> ${data.complaint_id || "N/A"}<br>
          <strong>Incident Type:</strong> ${data.incident_type || "N/A"}<br>
          <strong>Date:</strong> ${data.incident_date || "N/A"}<br>
          <strong>Platform:</strong> ${data.platform || "N/A"}<br>
          <strong>Description:</strong> ${data.description || "N/A"}
        `;
        document.getElementById('result').style.display = 'block';

      } catch (err) {
        loading.style.display = 'none';
        document.getElementById('result').innerHTML = `<strong>Error connecting to server:</strong> ${err.message}`;
        document.getElementById('result').style.display = 'block';
      }
    });

    // ✅ Logout Function
    function logoutUser() {
      localStorage.removeItem("username");
      window.location.href = "user_dashboard.html";
    }
  </script>

</body>
</html>
