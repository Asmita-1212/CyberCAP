<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit Cyber Complaint - CyberCAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .complaint-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      max-width: 650px;
      width: 100%;
      animation: fadeIn 1s ease forwards;
      opacity: 0;
      transform: translateY(-20px);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f3b73;
      font-size: 26px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 12px;
      resize: vertical;
      transition: border 0.3s;
    }

    textarea:focus {
      border-color: #3e64ff;
      outline: none;
      box-shadow: 0 0 6px rgba(62, 100, 255, 0.2);
    }

    .char-counter {
      text-align: right;
      font-size: 13px;
      color: #555;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #2b4ae0;
    }

    button:active {
      transform: scale(0.97);
    }

    #statusMessage {
      text-align: center;
      margin-top: 18px;
      font-size: 15px;
      font-weight: 500;
      display: none;
    }

    .loading::after {
      content: "⏳ Submitting...";
      color: #333;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .complaint-container {
        padding: 30px 20px;
      }

      textarea {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="complaint-container">
    <h2>Submit a Cyber Complaint</h2>

    <form id="complaintForm">
      <textarea id="complaintText" placeholder="Clearly describe your issue..." required maxlength="1000"></textarea>
      <div class="char-counter" id="charCount">0 / 1000</div>
      <button type="submit" id="submitBtn">Submit Complaint</button>
    </form>

    <p id="statusMessage"></p>
  </div>

  <script>
    const complaintText = document.getElementById("complaintText");
    const charCount = document.getElementById("charCount");
    const statusMessage = document.getElementById("statusMessage");
    const submitBtn = document.getElementById("submitBtn");

    // Character Counter
    complaintText.addEventListener("input", () => {
      const len = complaintText.value.length;
      charCount.textContent = `${len} / 1000`;
    });

    // Form Submit Handler
    document.getElementById("complaintForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const text = complaintText.value.trim();

      if (text.length < 20) {
        statusMessage.style.color = "red";
        statusMessage.innerText = "⚠️ Please provide a more detailed complaint (at least 20 characters).";
        statusMessage.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add("loading");
      statusMessage.style.display = "none";

      try {
        const response = await fetch("http://127.0.0.1:8000/complaints", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        const data = await response.json();

        if (response.ok) {
          statusMessage.style.color = "green";
          statusMessage.innerText = "✅ Complaint submitted successfully!";
          complaintText.value = "";
          charCount.textContent = "0 / 1000";
        } else {
          statusMessage.style.color = "red";
          statusMessage.innerText = data.detail || "❌ Submission failed.";
        }
      } catch (err) {
        statusMessage.style.color = "red";
        statusMessage.innerText = "⚠️ Failed to connect to the server.";
      }

      statusMessage.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.classList.remove("loading");
    });
  </script>
</body>
</html>
