<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybercrime Complaint Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset some default styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #639dd8;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 28px;
      color: #2c3e50;
    }

    form fieldset {
      border: 1px solid #d3dce6;
      padding: 25px;
      margin-bottom: 30px;
      border-radius: 8px;
      background-color: #f9fbfd;
    }

    legend {
      font-weight: bold;
      padding: 0 10px;
      color: #007bff;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #444;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccd6e0;
      border-radius: 6px;
      font-size: 15px;
      transition: border 0.3s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #007bff;
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    button[type="submit"] {
      background-color: #007bff;
      color: white;
      padding: 14px 30px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <!-- Placeholder for a logo -->
      <!-- <img src="logo.png" alt="Logo" style="height: 50px; margin-bottom: 10px;"> -->
      <h1>Cybercrime Complaint Form</h1>
    </header>

    <form id="complaintForm" enctype="multipart/form-data">

      <!-- Incident Details -->
      <fieldset>
        <legend>Incident Details</legend>

        <label>Type of Cybercrime:</label>
        <select required>
          <option value="">-- Select --</option>
          <option>Financial Fraud</option>
          <option>Social Media Harassment</option>
          <option>Phishing</option>
          <option>Online Stalking</option>
          <option>Hacking</option>
          <option>Other</option>
        </select>

        <label>Date of Incident:</label>
        <input type="date" required>

        <label>Time of Incident:</label>
        <input type="time">

        <label>Platform Involved:</label>
        <input type="text" placeholder="e.g. WhatsApp, Facebook, Email" required>

        <label>Description of Incident:</label>
        <textarea rows="5" required></textarea>
      </fieldset>

      <!-- Suspect Details -->
      <fieldset>
        <legend>Suspect Details (if known)</legend>

        <label>Phone Number:</label>
        <input type="tel">

        <label>Email ID:</label>
        <input type="email">

        <label>Social Media Handle:</label>
        <input type="text">

        <label>Bank Account Details:</label>
        <input type="text">
      </fieldset>

      <!-- Victim Details -->
      <fieldset>
        <legend>Victim Details</legend>

        <label>Full Name:</label>
        <input type="text" required>

        <label>Gender:</label>
        <select required>
          <option value="">-- Select --</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <label>Date of Birth:</label>
        <input type="date" required>

        <label>Address:</label>
        <textarea rows="3" required></textarea>

        <label>State:</label>
        <input type="text" required>

        <label>District:</label>
        <input type="text" required>

        <label>Email ID:</label>
        <input type="email" required>

        <label>Mobile Number:</label>
        <input type="tel" required>
      </fieldset>

      <!-- Attachments -->
      <fieldset>
        <legend>Attachments (Max 5MB each)</legend>

        <label>Upload Evidence:</label>
        <input type="file" accept=".jpg,.jpeg,.png,.pdf" multiple>
      </fieldset>

      <button type="submit">Submit Complaint</button>
    </form>
  </div>

</body>
</html>
