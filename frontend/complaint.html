<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit Cyber Complaint - CyberCAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .complaint-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      max-width: 650px;
      width: 100%;
      animation: fadeIn 1s ease forwards;
      opacity: 0;
      transform: translateY(-20px);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f3b73;
      font-size: 26px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 12px;
      resize: vertical;
      transition: border 0.3s;
    }

    textarea:focus {
      border-color: #3e64ff;
      outline: none;
      box-shadow: 0 0 6px rgba(62, 100, 255, 0.2);
    }

    .char-counter {
      text-align: right;
      font-size: 13px;
      color: #555;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #2b4ae0;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      background-color: #7a93f0;
      cursor: not-allowed;
    }

    #statusMessage {
      text-align: center;
      margin-top: 18px;
      font-size: 15px;
      font-weight: 600;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #statusMessage.show {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .complaint-container {
        padding: 30px 20px;
      }

      textarea {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="complaint-container">
    <h2>Submit a Cyber Complaint</h2>

    <form id="complaintForm">
      <textarea id="complaintText" placeholder="Clearly describe your issue..." required maxlength="1000"></textarea>
      <div class="char-counter" id="charCount">0 / 1000</div>
      <button type="submit" id="submitBtn">Submit Complaint</button>
    </form>

    <p id="statusMessage"></p>
  </div>

  <script>
    const complaintText = document.getElementById("complaintText");
    const charCount = document.getElementById("charCount");
    const statusMessage = document.getElementById("statusMessage");
    const submitBtn = document.getElementById("submitBtn");

    // Character Counter
    complaintText.addEventListener("input", () => {
      const len = complaintText.value.length;
      charCount.textContent = `${len} / 1000`;
    });

    // Utility function to show messages with fade-in and auto-hide
    function showMessage(text, type) {
      const icons = {
        success: "✅",
        error: "❌",
        warning: "⚠️"
      };
      statusMessage.innerText = `${icons[type] || ""} ${text}`;
      statusMessage.style.color = {
        success: "green",
        error: "red",
        warning: "orange"
      }[type] || "black";
      statusMessage.classList.add("show");

      // Auto-hide message after 4 seconds
      setTimeout(() => {
        statusMessage.classList.remove("show");
      }, 4000);

      // Scroll message into view
      statusMessage.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // Form Submit Handler
    document.getElementById("complaintForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      // Clear previous message immediately
      statusMessage.classList.remove("show");
      statusMessage.innerText = "";

      const text = complaintText.value.trim();

      if (text.length < 20) {
        showMessage("Please provide a more detailed complaint (at least 20 characters).", "warning");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      try {
        const response = await fetch("http://127.0.0.1:8000/complaints", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        const data = await response.json();

        if (response.ok) {
          showMessage("Complaint submitted successfully!", "success");
          complaintText.value = "";
          charCount.textContent = "0 / 1000";
        } else {
          showMessage(data.detail || "Submission failed.", "error");
        }
      } catch (err) {
        showMessage("Failed to connect to the server.", "error");
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Complaint";
    });
  </script>
</body>
</html>
