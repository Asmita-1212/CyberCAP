<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register Complaint - CyberCAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      color: #333;
      min-height: 100vh;
      padding-top: 70px;
    }

    .navbar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 40px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    .navbar .logo {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .navbar ul li a {
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      transition: color 0.3s;
      padding-bottom: 2px;
    }

    .navbar ul li a:hover {
      color: #56c5f8;
    }

    .navbar ul li a.active {
      color: #56c5f8;
      border-bottom: 2px solid #56c5f8;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 28px;
      color: #1f3b73;
    }

    form fieldset {
      border: 1px solid #d3dce6;
      padding: 25px;
      margin-bottom: 30px;
      border-radius: 8px;
      background-color: #f9fbfd;
    }

    legend {
      font-weight: bold;
      padding: 0 10px;
      color: #3e64ff;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccd6e0;
      border-radius: 6px;
      font-size: 15px;
      transition: border 0.3s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #3e64ff;
      outline: none;
    }

    textarea { resize: vertical; }

    input[type="file"] { margin-top: 10px; }

    button[type="submit"], .toggle-btn {
      background-color: #3e64ff;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
      display: block;
      margin: 15px auto;
    }

    button[type="submit"]:hover, .toggle-btn:hover { background-color: #2b4ae0; }

    .toggle-btn {
      background-color: #56c5f8;
      font-weight: 600;
    }

    .toggle-btn:hover {
      background-color: #34a2da;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {
      .navbar { flex-direction: column; padding: 10px 20px; }
      .navbar ul { flex-direction: column; gap: 10px; align-items: center; }
      .container { padding: 25px; }
    }

    label.required::after {
      content: " *";
      color: red;
    }
  </style>
</head>
<body>

<!-- ✅ CyberCAP Navbar -->
<nav class="navbar">
  <a href="user_dashboard.html" class="logo">CyberCAP</a>
  <ul>
    <li><a href="user_dashboard.html"><i class="fas fa-home"></i> Home</a></li>
    <li><a href="complaint.html" class="active"><i class="fas fa-edit"></i> Register Complaint</a></li>
    <li><a href="trackcomplaint.html"><i class="fas fa-search"></i> Track Complaint</a></li>
    <li><a href="reportsuspect.html"><i class="fas fa-exclamation-triangle"></i> Report Suspect</a></li>
    <li><a href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
  </ul>
</nav>

<!-- ✅ Complaint Form -->
<div class="container">
  <header>
    <h1>📝 Register a Cybercrime Complaint</h1>
  </header>

  <form id="complaintForm" enctype="multipart/form-data">

    <!-- Incident Details -->
    <fieldset>
      <legend>Incident Details</legend>
      <label class="required">Type of Cybercrime:</label>
      <select name="incident_type" required>
        <option value="">-- Select --</option>
        <option value="Financial Fraud">Financial Fraud</option>
        <option value="Phishing">Phishing</option>
        <option value="Online Stalking">Online Stalking</option>
        <option value="Hacking">Hacking</option>
        <option value="Social Media Harassment">Social Media Harassment</option>
        <option value="Other">Other</option>
      </select>

      <label class="required">Date of Incident:</label>
      <input type="date" name="incident_date" id="incident_date" required>

      <label>Time of Incident:</label>
      <input type="time" name="incident_time">

      <label class="required">Platform Involved:</label>
      <input type="text" name="platform" required placeholder="e.g., WhatsApp, Instagram, Email">

      <label class="required">Description of Incident:</label>
      <textarea name="description" rows="5" required></textarea>
    </fieldset>

    <!-- Victim Details -->
    <fieldset>
      <legend>Victim Details</legend>
      <label class="required">Full Name:</label>
      <input type="text" name="victim_name" required>

      <label class="required">Gender:</label>
      <select name="victim_gender" required>
        <option value="">-- Select --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <label class="required">Email ID:</label>
      <input type="email" name="victim_email" required>

      <label class="required">Mobile Number:</label>
      <input type="tel" name="victim_mobile" pattern="[0-9]{10}" maxlength="10" required>
    </fieldset>

    <!-- ✅ Collapsible Suspect Section -->
    <button type="button" class="toggle-btn" id="toggleSuspectBtn">➕ Add Suspect Details</button>

    <fieldset id="suspectSection" class="hidden">
      <legend>Suspect Details (Optional)</legend>

      <label>Suspect Name:</label>
      <input type="text" name="suspect_name" placeholder="Enter suspect name">

      <label>Suspect Email:</label>
      <input type="email" name="suspect_email" placeholder="Enter suspect email">

      <label>Suspect Phone:</label>
      <input type="tel" name="suspect_phone" pattern="[0-9]{10}" maxlength="10" placeholder="Enter 10-digit number">

      <label>Social Media Handle / Username:</label>
      <input type="text" name="suspect_handle" placeholder="@username / Profile Link">

      <label>Address (if known):</label>
      <textarea name="suspect_address" rows="3" placeholder="Enter suspect’s address"></textarea>
    </fieldset>

    <!-- Attachments -->
    <fieldset>
      <legend>Attachments (Optional)</legend>
      <label>Upload Evidence (JPG, PNG, PDF, max 5MB each):</label>
      <input type="file" name="attachments[]" accept=".jpg,.jpeg,.png,.pdf" multiple>
    </fieldset>

    <button type="submit">Submit Complaint</button>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("incident_date").setAttribute("max", today);

  const form = document.getElementById("complaintForm");
  const toggleBtn = document.getElementById("toggleSuspectBtn");
  const suspectSection = document.getElementById("suspectSection");

  toggleBtn.addEventListener("click", function() {
    suspectSection.classList.toggle("hidden");
    toggleBtn.innerText = suspectSection.classList.contains("hidden")
      ? "➕ Add Suspect Details"
      : "➖ Hide Suspect Details";
  });

  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const attachmentInput = form.querySelector('input[name="attachments[]"]');
    const attachments = attachmentInput ? Array.from(attachmentInput.files).map(f => f.name) : [];

    const data = {
      incident_type: form.incident_type.value,
      incident_date: form.incident_date.value,
      incident_time: form.incident_time.value,
      platform: form.platform.value,
      description: form.description.value,
      victim: {
        full_name: form.victim_name.value,
        gender: form.victim_gender.value,
        email: form.victim_email.value,
        mobile: form.victim_mobile.value
      },
      suspect: {
        name: form.suspect_name.value,
        email: form.suspect_email.value,
        phone: form.suspect_phone.value,
        handle: form.suspect_handle.value,
        address: form.suspect_address.value
      },
      attachments: attachments
    };

    try {
      const res = await fetch("http://127.0.0.1:8000/complaint", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.json();

      if (res.ok) {
        alert(`✅ ${result.message}\nComplaint ID: ${result.complaint_id || "N/A"}`);
        form.reset();
        suspectSection.classList.add("hidden");
        toggleBtn.innerText = "➕ Add Suspect Details";
      } else {
        alert(result.detail || "❌ Something went wrong!");
      }
    } catch (err) {
      console.error(err);
      alert("⚠️ Error submitting complaint.");
    }
  });
});

// ✅ Logout Function
function logoutUser() {
  localStorage.removeItem("username");
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
