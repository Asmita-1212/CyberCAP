<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberCAP</title>
</head>
<body>
    <h2>Login to CyberCAP</h2>

    <!-- Error/Success Message -->
    <p id="loginMessage" style="display:none;"></p>

    <form id="loginForm">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Login</button>
        <p><a href="forgot_password.html">Forgot Password?</a></p>
    </form>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("loginMessage");

            try {
                const response = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageEl.style.color = "green";
                    messageEl.innerText = "✅ Login successful!";
                    messageEl.style.display = "block";

                    // Save data in localStorage
                    localStorage.setItem("username", data.user.username);
                    localStorage.setItem("email", data.user.email);

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    messageEl.style.color = "red";
                    messageEl.innerText = (data.detail || "Invalid credentials");
                    messageEl.style.display = "block";
                }
            } catch (error) {
                messageEl.style.color = "red";
                messageEl.innerText = "⚠️ Error connecting to server.";
                messageEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
