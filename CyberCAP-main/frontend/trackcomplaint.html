<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberCAP — Track Complaint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #3b4ce2;
      --secondary: #6de1ff;
      --light: #ffffff;
      --muted: #6b7a99;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
      transition: all 0.3s ease;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #dce6ff, #f6f8ff 60%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 40px 35px;
      margin-top: 100px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h2 {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #0f1b3a;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid rgba(59, 76, 226, 0.1);
      border-radius: 10px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.7);
    }

    input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 6px rgba(59, 76, 226, 0.25);
    }

    button[type="submit"] {
      margin-top: 28px;
      width: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(59, 76, 226, 0.25);
    }

    button[type="submit"]:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(59, 76, 226, 0.3);
    }

    .loading {
      text-align: center;
      margin-top: 20px;
      display: none;
      color: var(--primary);
      font-weight: 600;
    }

    .spinner {
      border: 4px solid #e0e7ff;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #result {
      margin-top: 30px;
      display: none;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(59,76,226,0.15);
      padding: 20px;
      border-radius: 14px;
      color: #0f1b3a;
      box-shadow: 0 8px 22px rgba(0,0,0,0.05);
      line-height: 1.6;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      margin-bottom: 8px;
    }

    .pending { background: #f1c40f; }
    .resolved { background: #2ecc71; }
    .rejected { background: #e74c3c; }

    .topbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(12px);
      padding: 10px 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 90%;
      max-width: 1000px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-section img {
      height: 50px;
      width: 50px;
      border-radius: 8px;
    }

    .logo-section h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }

    .back-btn {
      background: linear-gradient(90deg,#ff6b6b,#ffa3a3);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }

    .back-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="logo-section">
      <img src="logo.png" alt="CyberCAP Logo">
      <h1>CyberCAP | Track Complaint</h1>
    </div>
    <a href="user_dashboard.html" class="back-btn">Back</a>
  </div>

  <div class="container">
    <header>
      <h2>Check Your Complaint Status</h2>
      <p>Enter your Complaint ID or registered mobile number.</p>
    </header>

    <form id="trackForm">
      <label for="complaintId">Complaint ID:</label>
      <input type="text" id="complaintId" name="complaintId" placeholder="e.g. CMP20251101">

      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" placeholder="e.g. 9876543210">

      <button type="submit">Track Complaint</button>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      Fetching your complaint status...
    </div>

    <div id="result">
      <span class="status-badge pending">Pending</span><br>
      Complaint ID: CMP20251101<br>
      Filed on: 2 Nov 2025<br>
      Officer Assigned: R. Mehta<br>
      Remarks: Under verification.
    </div>
  </div>

  <script>
    const form = document.getElementById('trackForm');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      loading.style.display = 'block';
      result.style.display = 'none';

      setTimeout(() => {
        loading.style.display = 'none';
        result.style.display = 'block';
      }, 1500);
    });
  </script>
</body>
</html>
