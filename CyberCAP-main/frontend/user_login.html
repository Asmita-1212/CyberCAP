<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - CyberCAP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(90deg, #000000, #131212);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      width: 100%;
    }

    .navbar .logo {
      color: #ecf3f5;
      font-size: 30px;
      font-weight: bold;
      text-decoration: none;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 25px;
      padding: 0;
      margin: 0;
    }

    .navbar ul li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
    }

    .navbar ul li a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* LOGIN BOX */
    .login-box {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0px 12px 24px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      margin-top: 60px;
      animation: slideDown 1s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-box h2 {
      text-align: center;
      color: #1f3b73;
      margin-bottom: 25px;
      font-size: 24px;
    }

    /* INPUT STYLE */
    label {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      font-size: 14px;
    }

   input {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: 100%;
  margin-bottom: 15px;
  font-size: 14px;
  box-sizing: border-box;
}

input:focus {
  border-color: #3e64ff;
  box-shadow: 0px 0px 5px rgba(62, 100, 255, 0.25);
  outline: none;
}

    button {
      padding: 14px;
      width: 100%;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      background-color: #223fd1;
    }

    .login-box a {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #3e64ff;
      text-decoration: none;
      font-size: 14px;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    #loginMessage {
      text-align: center;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
      font-weight: 600;
    }
    .chatbot-nav i {
  margin-right: 6px;
  color: #2563eb;   /* Blue highlight */
}
.chatbot-nav:hover {
  color: #1e40af;
}
  </style>
</head>

<body>

<nav class="navbar">
  <a href="#" class="logo">CyberCAP</a>
  <ul>
    <li><a href="dashboard.html">Home</a></li>
    <li><a href="cybervoluteer.html">Cyber Volunteers</a></li>
    <li><a href="learncorner.html">Learning Corner</a></li>
    <li><a href="contactus.html">Contact Us</a></li>
       <li class="nav-item"><a href="chatbot.html" class="nav-link chatbot-nav">
    <i class="fas fa-comment-dots"></i> Chatbot</a>
  </ul>
</nav>

<div class="login-box">
  <h2>Login to CyberCAP</h2>
  <p id="loginMessage"></p>

  <form id="loginForm">
    <label>Email or Admin Username</label><br><br>
    <input type="text" id="email" required placeholder="Enter your email or admin username">

    <label>Password</label><br><br>
    <input type="password" id="password" required placeholder="Enter your password">

    <button type="submit">Login</button>

    <a href="forgot_password.html">Forgot Password?</a>
    <a href="register.html">New user? Register here</a>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const inputValue = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("loginMessage");

    const allowedAdmins = ["admin1", "admin2"];

    try {

        /* ---------------- ADMIN LOGIN ---------------- */
        if (allowedAdmins.includes(inputValue)) {

            const response = await fetch("http://127.0.0.1:8000/admin-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: inputValue, password }),
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("pendingAdmin", inputValue);
                window.location.href = "admin_otp.html";
                return;
            } else {
                messageEl.style.color = "red";
                messageEl.innerText = data.detail || "Invalid admin credentials";
                messageEl.style.display = "block";
                return;
            }
        }

        /* ---------------- USER LOGIN ---------------- */
        if (!inputValue.includes("@")) {
            messageEl.style.color = "red";
            messageEl.innerText = "Please enter a valid email.";
            messageEl.style.display = "block";
            return;
        }

        const response = await fetch("http://127.0.0.1:8000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: inputValue, password }),
        });

        const data = await response.json();

        if (response.ok) {
            messageEl.style.color = "green";
            messageEl.innerText = "Login successful!";
            messageEl.style.display = "block";

            localStorage.setItem("username", data.user.username);
            localStorage.setItem("email", data.user.email);

            setTimeout(() => {
                window.location.href = "user_dashboard.html";
            }, 800);

        } else {
            messageEl.style.color = "red";
            messageEl.innerText = data.detail || "Invalid login";
            messageEl.style.display = "block";
        }

    } catch (error) {
        messageEl.style.color = "red";
        messageEl.innerText = "⚠ Server error";
        messageEl.style.display = "block";
    }
});
</script>

</body>
</html>
