<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - CyberCAP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
       background-color: #a6b3a8;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
    }

    /* NAVBAR */
    /* ================= NAVBAR (UPDATED TO MATCH VOLUNTEER PAGE) ================= */
nav {
  background: #000;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 40px;
  border-bottom: 2px solid cyan;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

nav .logo {
  display: flex;
  align-items: center;
  text-decoration: none;
}

nav .logo img {
  height: 40px;
  margin-right: 10px;
  border-radius: 40px;
  filter: drop-shadow(0 0 3px cyan);
}

nav .logo span {
  color: cyan;
  font-size: 22px;
  font-weight: bold;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 25px;
}

nav ul li a {
  color: #f0f0f0;
  text-decoration: none;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: 0.3s ease;
}

nav ul li a:hover {
  color: cyan;
}

/* Chatbot Icon Style */
.chatbot-nav i {
  margin-right: 6px;
  color: #1e90ff;
}

.chatbot-nav:hover {
  color: #1e40af;
}

/* Responsive */
@media (max-width: 700px) {
  nav {
    flex-direction: column;
    align-items: flex-start;
    padding: 15px 25px;
  }

  nav ul {
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    margin-top: 10px;
    gap: 15px;
  }
}

/* Add space so login box does not hide behind navbar */
body {
  padding-top: 80px;
}


    /* LOGIN BOX */
    .login-box {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0px 12px 24px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      margin-top: 60px;
      animation: slideDown 1s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-box h2 {
      text-align: center;
      color: #1f3b73;
      margin-bottom: 25px;
      font-size: 24px;
    }

    /* INPUT STYLE */
    label {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      font-size: 14px;
    }

   input {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: 100%;
  margin-bottom: 15px;
  font-size: 14px;
  box-sizing: border-box;
}

input:focus {
  border-color: #3e64ff;
  box-shadow: 0px 0px 5px rgba(62, 100, 255, 0.25);
  outline: none;
}

    button {
      padding: 14px;
      width: 100%;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      background-color: #223fd1;
    }

    .login-box a {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #3e64ff;
      text-decoration: none;
      font-size: 14px;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    #loginMessage {
      text-align: center;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
      font-weight: 600;
    }
    .chatbot-nav i {
  margin: right 10px;
  color: #2563eb;   /* Blue highlight */
}
.chatbot-nav:hover {
  color: #c1eef7;
}
  </style>
</head>

<body>

<nav>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="CyberCAP Logo">
    <span>CyberCAP</span>
  </a>

  <ul>
    <li><a href="dashboard.html"><i class="fas fa-home"></i> Home</a></li>
    <li><a href="cybervoluteer.html"><i class="fas fa-users"></i> Volunteers</a></li>
    <li><a href="learncorner.html"><i class="fas fa-book"></i> Learning</a></li>
    <li><a href="contactus.html"><i class="fas fa-envelope"></i> Contact</a></li>
    <li><a href="chatbot.html" class="chatbot-nav"><i class="fas fa-comment-dots"></i> Chatbot</a></li>
  </ul>
</nav>


<div class="login-box">
  <h2>Login to CyberCAP</h2>
  <p id="loginMessage"></p>

  <form id="loginForm">
    <label>Email or Admin Username</label><br><br>
    <input type="text" id="email" required placeholder="Enter your email or admin username">

    <label>Password</label><br><br>
    <input type="password" id="password" required placeholder="Enter your password">

    <button type="submit">Login</button>

    <a href="forgot_password.html">Forgot Password?</a>
    <a href="register.html">New user? Register here</a>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const inputValue = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("loginMessage");

    const allowedAdmins = ["admin1", "admin2"];

    try {

        /* ---------------- ADMIN LOGIN ---------------- */
        if (allowedAdmins.includes(inputValue)) {

            const response = await fetch("http://127.0.0.1:8000/admin-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: inputValue, password }),
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("pendingAdmin", inputValue);
                window.location.href = "admin_otp.html";
                return;
            } else {
                messageEl.style.color = "red";
                messageEl.innerText = data.detail || "Invalid admin credentials";
                messageEl.style.display = "block";
                return;
            }
        }

        /* ---------------- USER LOGIN ---------------- */
        if (!inputValue.includes("@")) {
            messageEl.style.color = "red";
            messageEl.innerText = "Please enter a valid email.";
            messageEl.style.display = "block";
            return;
        }

        const response = await fetch("http://127.0.0.1:8000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: inputValue, password }),
        });

        const data = await response.json();

        if (response.ok) {
            messageEl.style.color = "green";
            messageEl.innerText = "Login successful!";
            messageEl.style.display = "block";

            localStorage.setItem("username", data.user.username);
            localStorage.setItem("email", data.user.email);

            setTimeout(() => {
                window.location.href = "user_dashboard.html";
            }, 800);

        } else {
            messageEl.style.color = "red";
            messageEl.innerText = data.detail || "Invalid login";
            messageEl.style.display = "block";
        }

    } catch (error) {
        messageEl.style.color = "red";
        messageEl.innerText = "⚠ Server error";
        messageEl.style.display = "block";
    }
});
</script>

</body>
</html>
