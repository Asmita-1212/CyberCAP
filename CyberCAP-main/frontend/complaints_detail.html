<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complaint Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f6fa;
      color: #333;
    }

    h2 {
      color: #1f2833;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 10px;
    }

    .label {
      font-weight: bold;
    }

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .attachment-item img {
      width: 150px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .attachment-item img:hover {
      transform: scale(1.05);
    }

    select, button {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    button {
      background: #2e86de;
      color: #fff;
      font-weight: bold;
      border: none;
      transition: 0.2s;
    }

    button:hover {
      background: #1b4f72;
    }

    .status-update {
      margin-top: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

   .attachment-item img {
  transition: all 0.3s ease;
  cursor: zoom-in;
}
.email-section {
  background: #fff;
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}


  </style>
</head>
<body>
  <h2>Complaint Details</h2>
  <div id="complaintDetail">Loading...</div>
<div class="email-section">
  <h3>Send Official Email</h3>
  <button onclick="toggleEmailBox()">Send Official Email to User</button>

  <div id="emailBox" style="display:none; margin-top:15px;">
    <label><b>User Email:</b></label><br>
    <input type="email" id="emailToUser" value="${c.victim?.email || c.registered_by}" readonly 
           style="padding:8px; width:300px; border-radius:6px; border:1px solid #ccc;">

    <br><br>

    <label><b>Message:</b></label><br>
    <textarea id="adminEmailMsg" 
              placeholder="Type your message here..." 
              style="padding:8px; width:100%; height:120px; border-radius:6px; border:1px solid #ccc;"></textarea>

    <br><br>
    <button onclick="sendOfficialEmail()">Send</button>
  </div>
</div>
<br><br>

  <script>
    async function loadComplaintDetail() {
      const c_id = localStorage.getItem("selectedComplaintId");
      console.log("Loaded complaint ID:", c_id);

      if (!c_id) {
        document.getElementById("complaintDetail").innerHTML = "No complaint selected!";
        return;
      }

      try {
        const res = await fetch(`http://127.0.0.1:8000/complaint/${c_id}`);
        if (!res.ok) throw new Error("Complaint not found");

        const c = await res.json();
        const container = document.getElementById("complaintDetail");

        // Display attachments as clickable thumbnails or links
       // Display attachments as clickable thumbnails or links
let attachmentHTML = "None";
if (c.attachments?.length > 0) {
  attachmentHTML = `<div class="attachments">` +
    c.attachments.map(a => {
      // Ensure a is an object
      const filename = a.filename || "attachment";
      const contentType = a.content_type || "";
      const base64Data = a.data || "";

      if (contentType.startsWith("image/")) {
        return `
          <div class="attachment-item">
            <img src="data:${contentType};base64,${base64Data}"
                 alt="${filename}"
                 title="${filename}">
          </div>`;
      } else {
        return `
          <div class="attachment-item">
            <a href="data:${contentType};base64,${base64Data}"
               download="${filename}">
               📎 ${filename}
            </a>
          </div>`;
      }
    }).join('') +
    `</div>`;
}
        container.innerHTML = `
          <div class="field"><span class="label">User:</span> ${c.victim?.email || c.registered_by || "N/A"}</div>
          <div class="field"><span class="label">Description:</span> ${c.translated_description || "N/A"}</div>
          <div class="field"><span class="label">Category:</span> ${c.category || "N/A"}</div>
          <div class="field"><span class="label">Priority:</span> ${c.priority || "N/A"}</div>
          <div class="field"><span class="label">Status:</span> <span id="statusValue">${c.status || "Pending"}</span></div>
          <div class="field"><span class="label">Date:</span> ${c.created_at ? new Date(c.created_at).toLocaleString() : "N/A"}</div>
          <div class="field"><span class="label">Attachments:</span> ${attachmentHTML}</div>

          <div class="status-update">
            <h3>Update Status</h3>
            <select id="statusSelect">
              <option value="Pending" ${c.status === "Pending" ? "selected" : ""}>Pending</option>
              <option value="In Progress" ${c.status === "In Progress" ? "selected" : ""}>In Progress</option>
              <option value="Resolved" ${c.status === "Resolved" ? "selected" : ""}>Resolved</option>
            </select>
            <button onclick="updateStatus('${c._id}')">Update</button>
          </div>
        `;

        document.getElementById("emailToUser").value =
  c.victim?.email || c.registered_by || "";
      } catch (err) {
        console.error(err);
        document.getElementById("complaintDetail").innerHTML =
          "Failed to load complaint: " + err.message;
      }
    }
    async function updateStatus(id) {
      const newStatus = document.getElementById("statusSelect").value;

      try {
        const res = await fetch(`http://127.0.0.1:8000/complaint/${id}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ status: newStatus }),
        });

        if (!res.ok) throw new Error("Failed to update status");

        document.getElementById("statusValue").innerText = newStatus;
        alert("Status updated successfully!");
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    window.addEventListener("DOMContentLoaded", loadComplaintDetail);

    // 🔹 Toggle image fullscreen on click (perfect revert)
document.addEventListener("click", function (e) {
  const img = e.target;
  if (img.tagName === "IMG" && img.closest(".attachment-item")) {
    if (img.classList.contains("enlarged")) {
      // Shrink back to original state
      img.classList.remove("enlarged");
      Object.assign(img.style, {
        position: "",
        top: "",
        left: "",
        width: "",
        height: "",
        zIndex: "",
        objectFit: "",
        cursor: "zoom-in",
        backgroundColor: "",
        transform: "", // ✅ important reset
        boxShadow: ""  // ✅ removes glow/overlay
      });
      document.body.style.backgroundColor = ""; // ✅ reset background if modified
    } else {
      // Enlarge fullscreen
      img.classList.add("enlarged");
      Object.assign(img.style, {
        position: "fixed",
        top: "50%",
        left: "50%",
        transform: "translate(-50%, -50%)",
        width: "90vw",
        height: "90vh",
        objectFit: "contain",
        zIndex: "9999",
        cursor: "zoom-out",
        boxShadow: "0 0 20px rgba(0,0,0,0.5)"
      });
      document.body.style.backgroundColor = "rgba(0,0,0,0.7)"; // ✅ soft dark backdrop
    }
  }
});
 
function toggleEmailBox() {
  const box = document.getElementById("emailBox");
  box.style.display = box.style.display === "none" ? "block" : "none";
}
async function sendOfficialEmail() {
  const userEmail = document.getElementById("emailToUser").value;
  const adminMsg = document.getElementById("adminEmailMsg").value;

  if (!adminMsg.trim()) {
    alert("Please type a message.");
    return;
  }

  try {
    const res = await fetch("http://127.0.0.1:8000/send_mail", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: userEmail,
        msg: adminMsg
      })
    });

    if (!res.ok) throw new Error("Failed to send email");

    alert("Official Email Sent Successfully!");

  } catch (err) {
    alert("Error: " + err.message);
  }
}

  </script>
</body>
</html>
