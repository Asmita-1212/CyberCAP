<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - CyberCAP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
body {
  margin: 0;
  padding: 0;
  min-height: 100vh;

  background: linear-gradient(
    to bottom,
    #4d7bff 0%,
    #55a0ff 50%,
    #4d7bff 100%
  );
  background-attachment: fixed; /* smooth, non-cut gradient */
}

.navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  width: 100%;
  background: linear-gradient(90deg, #000000, #131212);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 40px;  /* reduced padding */
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
    .navbar .logo {
      color: #ecf3f5;
      font-size: 30px;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navbar .logo img {
      height: 45px;
      border-radius: 40px;
      filter: drop-shadow(0 0 4px cyan);
    }

    .navbar ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .navbar ul li a {
      color: #f5f0f0;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 6px;
      transition: 0.3s;
    }

    .navbar ul li a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* Register Box */
    .register-container {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      margin: 40px auto;
      animation: fadeSlideIn 1s ease forwards;
      opacity: 0;
      transform: translateY(-30px);
    }

    @keyframes fadeSlideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .register-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f3b73;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }

    input {
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: 0.3s;
      width: 100%;
    }

    input:focus {
      border-color: #3e64ff;
      box-shadow: 0 0 8px rgba(62,100,255,0.3);
      outline: none;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #666;
    }

    button {
      padding: 12px;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #2b4ae0;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
    .register-container a {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #3e64ff;
      text-decoration: none;
      font-size: 14px;
    }

    .register-container a:hover {
      text-decoration: underline;
    }
    .chatbot-nav i {
  margin-right: 6px;
  color: #2563eb;   /* Blue highlight */
}
.chatbot-nav:hover {
  color: #1e40af;
}

    /* 📱 Mobile Navbar */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        text-align: center;
        gap: 10px;
        padding: 15px 20px;
      }

      .navbar ul {
        flex-direction: column;
        gap: 12px;
      }

      .register-container {
        margin-top: 60px;
      }
    }

    @media (max-width: 500px) {
      .register-container {
        padding: 30px 20px;
      }
    }

  </style>
</head>

<body>

  <!-- 🌐 Navbar -->
  <nav class="navbar">
    <a href="#" class="logo">
      <img src="logo.png"> CyberCAP
    </a>

    <ul>
      <li><a href="dashboard.html">Home</a></li>
      <li><a href="cybervoluteer.html">Cyber Volunteers</a></li>
      <li><a href="learncorner.html">Learning</a></li>
      <li><a href="user_login.html">User Login</a></li>
      <li><a href="contactus.html">Contact</a></li>
         <li class="nav-item"><a href="chatbot.html" class="nav-link chatbot-nav">
    <i class="fas fa-comment-dots"></i> Chatbot</a></li>
    </ul>
  </nav>

  <!-- Register Form -->
  <div class="register-container">
    <h2>Create a New Account</h2>

    <form id="registerForm">
      <label for="username">Full Name</label>
      <input type="text" id="username" required placeholder="Enter your full name" />

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="Enter your email" />

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" required placeholder="Create a password" />
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>

      <button type="submit">Register</button>
      <a href="user_login.html">sign in</a>
    </form>

    <p id="message"></p>
  </div>

  <script>
    function togglePassword() {
      const passInput = document.getElementById("password");
      passInput.type = passInput.type === "password" ? "text" : "password";
    }

    document.getElementById("registerForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const messageEl = document.getElementById("message");

      try {
        const response = await fetch("http://127.0.0.1:8000/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          messageEl.style.color = "green";
          messageEl.innerText = "✅ Registration successful!";
        } else {
          messageEl.style.color = "red";
          messageEl.innerText = "❌ " + (data.detail || "Registration failed");
        }

        messageEl.style.display = "block";
      } catch (error) {
        messageEl.style.color = "red";
        messageEl.innerText = "⚠️ Error connecting to server.";
        messageEl.style.display = "block";
      }
    });
  </script>

</body>
</html>
