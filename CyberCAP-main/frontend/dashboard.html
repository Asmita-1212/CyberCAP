<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberCAP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff8f8;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(90deg, #000000, #131212);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .navbar .logo {
      color: #ecf3f5;
      font-size: 30px;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .navbar ul li {
      position: relative;
    }

    .navbar ul li a,
    .dropbtn {
      color: #f5f0f0;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      
      background: none;
      border: none;
      cursor: pointer;
    }

    .navbar ul li a:hover,
    .dropbtn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 40px;
      left: 0;
      background-color: #545dda;
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      border-radius: 6px;
      overflow: hidden;
    }

    .dropdown-content a {
      color: #000;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      
    }

    .dropdown-content a:hover {
      background-color: #e06deb;
      color: #b9d43c;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Slider */
    .slider {
      width: 100%;
      overflow: hidden;
    }

    

    .slides img {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }

    

    /* Crime Cards */
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2%;
    }

    .crime-card {
      background: white;
      margin: 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0px 6px 8px rgba(0, 0, 0, 0.2);
      width: 450px;
    }

    .crime-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
    }

    .card-title {
      font-size: 18px;
      margin-bottom: 10px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      margin-left: 25px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }

    .btn-register {
      background-color: #0d6efd;
    }

    .btn-track {
      background-color: #198754;
    }

    h1.section-title {
      text-align: center;
      background-color: black;
      color: #ee6666;
      padding: 20px;
      margin: 0;
    }

    @media (max-width: 768px) {
      .slides img {
        height: 300px;
      }
      .crime-card {
        width: 90%;
      }
    }
  </style>
</head>
