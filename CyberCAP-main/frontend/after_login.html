<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberCAP Dashboard</title>
</head>
<body style="margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(135deg, #5edfff, #3e64ff); height:100vh; display:flex; justify-content:center; align-items:center;">

  <div style="background:#ffffff; padding:40px 30px; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,0.15); text-align:center; max-width:420px; width:100%; animation:fadeSlideDown 1s ease forwards; opacity:0; transform:translateY(-30px);">
    <h2 style="color:#1f3b73; margin-bottom:25px;">Welcome, <span id="usernameDisplay" style="color:#3e64ff;"></span> 👋</h2>

    <button onclick="window.location.href='Complaint.html'" style="width:100%; padding:14px; margin-bottom:15px; background:linear-gradient(to right, #3e64ff, #5edfff); color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer; transition:transform 0.2s;">📝 Register Complaint</button>

    <button onclick="window.location.href='trackcomplaint.html'" style="width:100%; padding:14px; margin-bottom:15px; background:linear-gradient(to right, #3e64ff, #5edfff); color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer; transition:transform 0.2s;">🔍 Track Complaint</button>

    <button onclick="window.location.href='profile.html'" style="width:100%; padding:14px; margin-bottom:15px; background:linear-gradient(to right, #3e64ff, #5edfff); color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer; transition:transform 0.2s;">👤 View Profile</button>

    <button onclick="window.location.href='dashboard.html'" style="width:100%; padding:14px; background-color:#ff4d4d; color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer; transition:transform 0.2s;">🚪 Logout</button>
  </div>

  <script>
    document.getElementById("usernameDisplay").innerText = localStorage.getItem("username");

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }
  </script>

  <style>
    @keyframes fadeSlideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button:hover {
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</body>
</html>
