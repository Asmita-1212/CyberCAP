<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybercrime Complaint Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #639dd8; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 28px; color: #2c3e50; }
    form fieldset { border: 1px solid #d3dce6; padding: 25px; margin-bottom: 30px; border-radius: 8px; background-color: #f9fbfd; }
    legend { font-weight: bold; padding: 0 10px; color: #007bff; }
    label { display: block; margin-top: 20px; font-weight: 600; color: #444; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccd6e0; border-radius: 6px; font-size: 15px; transition: border 0.3s; }
    input:focus, textarea:focus, select:focus { border-color: #007bff; outline: none; }
    textarea { resize: vertical; }
    input[type="file"] { margin-top: 10px; }
    button[type="submit"] { background-color: #007bff; color: white; padding: 14px 30px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
    button[type="submit"]:hover { background-color: #0056b3; }
    @media (max-width: 600px) { .container { padding: 20px; } header h1 { font-size: 22px; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Cybercrime Complaint Form</h1>
  </header>

  <form id="complaintForm" enctype="multipart/form-data">

    <!-- Hidden Complaint ID (Optional) -->
    <input type="hidden" name="complaint_id" value="">

    <!-- Incident Details -->
    <fieldset>
      <legend>Incident Details</legend>
      <label>Type of Cybercrime:</label>
      <select name="incident_type" required>
        <option value="">-- Select --</option>
        <option value="Financial Fraud">Financial Fraud</option>
        <option value="Social Media Harassment">Social Media Harassment</option>
        <option value="Phishing">Phishing</option>
        <option value="Online Stalking">Online Stalking</option>
        <option value="Hacking">Hacking</option>
        <option value="Other">Other</option>
      </select>

      <label>Date of Incident:</label>
      <input type="date" name="incident_date" required>

      <label>Time of Incident:</label>
      <input type="time" name="incident_time">

      <label>Platform Involved:</label>
      <select name="platform" required>
        <option value="">-- Select --</option>
        <option value="WhatsApp">WhatsApp</option>
        <option value="Facebook">Facebook</option>
        <option value="Email">Email</option>
        <option value="Instagram">Instagram</option>
        <option value="Other">Other</option>
      </select>

      <label>Description of Incident:</label>
      <textarea name="description" rows="5" required></textarea>
    </fieldset>

    <!-- Suspect Details -->
    <fieldset>
      <legend>Suspect Details (if known)</legend>
      <label>Phone Number:</label>
      <input type="tel" name="suspect_phone" pattern="[0-9]{10}" maxlength="10">

      <label>Email ID:</label>
      <input type="email" name="suspect_email">

      <label>Social Media Handle:</label>
      <input type="text" name="suspect_handle">

      <label>Bank Account Details:</label>
      <input type="text" name="suspect_bank">
    </fieldset>

    <!-- Victim Details -->
    <fieldset>
      <legend>Victim Details</legend>
      <label>Full Name:</label>
      <input type="text" name="victim_name" required>

      <label>Gender:</label>
      <select name="victim_gender" required>
        <option value="">-- Select --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <label>Date of Birth:</label>
      <input type="date" name="victim_dob" required>

      <label>Address:</label>
      <textarea name="victim_address" rows="3" required></textarea>

      <label>State:</label>
      <select name="victim_state" required>
        <option value="">-- Select --</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Delhi">Delhi</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Other">Other</option>
      </select>

      <label>District:</label>
      <input type="text" name="victim_district" required>

      <label>Email ID:</label>
      <input type="email" name="victim_email" required>

      <label>Mobile Number:</label>
      <input type="tel" name="victim_mobile" pattern="[0-9]{10}" maxlength="10" required>
    </fieldset>

    <!-- Attachments -->
    <fieldset>
      <legend>Attachments (Max 5MB each)</legend>
      <label>Upload Evidence:</label>
      <input type="file" name="attachments[]" accept=".jpg,.jpeg,.png,.pdf" multiple>
    </fieldset>

    <button type="submit">Submit Complaint</button>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const form = document.getElementById("complaintForm");

  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    // Get logged-in user's email from localStorage
    const userEmail = localStorage.getItem("email");
    if (!userEmail) {
      alert("⚠️ You must be logged in to submit a complaint.");
      return;
    }

    // Handle attachments safely
    const attachmentInput = form.querySelector('input[name="attachments[]"]');
    const attachments = attachmentInput ? Array.from(attachmentInput.files).map(f => f.name) : [];

    // Prepare complaint data
    const data = {
      incident_type: form.incident_type.value,
      incident_date: form.incident_date.value,
      incident_time: form.incident_time.value,
      platform: form.platform.value,
      description: form.description.value,
      attachments: attachments,
      victim: {
        full_name: form.victim_name.value,
        gender: form.victim_gender.value,
        dob: form.victim_dob.value,
        address: form.victim_address.value,
        state: form.victim_state.value,
        district: form.victim_district.value,
        email: userEmail, // Use logged-in user's email here
        mobile: form.victim_mobile.value
      },
      suspect: {
        phone: form.suspect_phone.value || null,
        email: form.suspect_email.value || null,
        social_handle: form.suspect_handle.value || null,
        bank_account: form.suspect_bank.value || null
      }
    };

    try {
      // Send complaint to backend
      const res = await fetch("http://127.0.0.1:8000/complaint", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      console.log(result);

      if(res.ok){
        alert(`✅ ${result.message}\nYour Complaint ID: ${result.complaint_id || "N/A"}`);
        form.reset();
      } else {
        alert(result.detail || "Something went wrong!");
      }
    } catch(err){
      console.error(err);
      alert("Error submitting complaint. Check console for details.");
    }
  });
});


</script>

</body>
</html>
