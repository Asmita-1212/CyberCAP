<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberCAP — File a Complaint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #3b4ce2;
      --secondary: #6de1ff;
      --light: #ffffff;
      --muted: #6b7a99;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
      transition: all 0.25s ease;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #dce6ff, #f6f8ff 60%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 120px 20px 40px;
    }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(12px);
      padding: 10px 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 90%;
      max-width: 1000px;
      z-index: 100;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-section img {
      height: 48px;
      width: 48px;
      border-radius: 8px;
    }

    .logo-section h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }

    .back-btn {
      background: linear-gradient(90deg,#ff6b6b,#ffa3a3);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }

    .back-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Container */
    .container {
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 900px;
      padding: 40px 35px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h2 {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
    }

    fieldset {
      border: 1px solid rgba(59, 76, 226, 0.2);
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 12px;
      background-color: rgba(255,255,255,0.7);
    }

    legend {
      font-weight: 700;
      color: var(--primary);
      padding: 0 10px;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #0f1b3a;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid rgba(59, 76, 226, 0.15);
      border-radius: 10px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.8);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 6px rgba(59, 76, 226, 0.25);
      background: #fff;
    }

    textarea { resize: vertical; }

    button[type="submit"] {
      display: block;
      margin: 30px auto 0;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      padding: 14px 35px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(59, 76, 226, 0.25);
    }

    button[type="submit"]:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(59, 76, 226, 0.3);
    }

    @media(max-width: 768px) {
      .container { padding: 25px 20px; }
      .logo-section h1 { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo-section">
      <img src="logo.png" alt="CyberCAP Logo">
      <h1>CyberCAP | File Complaint</h1>
    </div>
    <a href="user_dashboard.html" class="back-btn">Back</a>
  </div>

  <div class="container">
    <header>
      <h2>📝 File a Cybercrime Complaint</h2>
      <p>Please fill all details accurately. Your information will be kept confidential.</p>
    </header>

    <form id="complaintForm" enctype="multipart/form-data">

      <fieldset>
        <legend>Incident Details</legend>
        <label>Type of Cybercrime:</label>
        <select name="incident_type" required>
          <option value="">-- Select --</option>
          <option>Financial Fraud</option>
          <option>Social Media Harassment</option>
          <option>Phishing</option>
          <option>Online Stalking</option>
          <option>Hacking</option>
          <option>Other</option>
        </select>

        <label>Date of Incident:</label>
        <input type="date" name="incident_date" required>

        <label>Time of Incident:</label>
        <input type="time" name="incident_time">

        <label>Platform Involved:</label>
        <select name="platform" required>
          <option value="">-- Select --</option>
          <option>WhatsApp</option>
          <option>Facebook</option>
          <option>Email</option>
          <option>Instagram</option>
          <option>Other</option>
        </select>

        <label>Description of Incident:</label>
        <textarea name="description" rows="4" required></textarea>
      </fieldset>

      <fieldset>
        <legend>Suspect Details (if known)</legend>
        <label>Phone Number:</label>
        <input type="tel" name="suspect_phone" pattern="[0-9]{10}" maxlength="10">

        <label>Email ID:</label>
        <input type="email" name="suspect_email">

        <label>Social Media Handle:</label>
        <input type="text" name="suspect_handle">

        <label>Bank Account Details:</label>
        <input type="text" name="suspect_bank">
      </fieldset>

      <fieldset>
        <legend>Victim Details</legend>
        <label>Full Name:</label>
        <input type="text" name="victim_name" required>

        <label>Gender:</label>
        <select name="victim_gender" required>
          <option value="">-- Select --</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <label>Date of Birth:</label>
        <input type="date" name="victim_dob" required>

        <label>Address:</label>
        <textarea name="victim_address" rows="3" required></textarea>

        <label>State:</label>
        <select name="victim_state" required>
          <option value="">-- Select --</option>
          <option>Maharashtra</option>
          <option>Karnataka</option>
          <option>Delhi</option>
          <option>Tamil Nadu</option>
          <option>Other</option>
        </select>

        <label>District:</label>
        <input type="text" name="victim_district" required>

        <label>Email ID:</label>
        <input type="email" name="victim_email" required>

        <label>Mobile Number:</label>
        <input type="tel" name="victim_mobile" pattern="[0-9]{10}" maxlength="10" required>
      </fieldset>

      <fieldset>
        <legend>Attachments (Max 5MB each)</legend>
        <label>Upload Evidence:</label>
        <input type="file" name="attachments[]" accept=".jpg,.jpeg,.png,.pdf" multiple>
      </fieldset>

      <button type="submit">Submit Complaint</button>
    </form>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("complaintForm");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const userEmail = localStorage.getItem("email");
      if (!userEmail) {
        alert("⚠️ You must be logged in to submit a complaint.");
        return;
      }

      const attachmentInput = form.querySelector('input[name="attachments[]"]');
      let attachments = [];

      if (attachmentInput && attachmentInput.files.length > 0) {
        const formData = new FormData();
        Array.from(attachmentInput.files).forEach(file => formData.append("files", file));

        const uploadRes = await fetch("http://127.0.0.1:8000/upload", { method: "POST", body: formData });
        const uploadData = await uploadRes.json();
        attachments = uploadData.filenames;
      }

      const data = {
        incident_type: form.incident_type.value,
        incident_date: form.incident_date.value,
        incident_time: form.incident_time.value,
        platform: form.platform.value,
        description: form.description.value,
        attachments: attachments,
        victim: {
          full_name: form.victim_name.value,
          gender: form.victim_gender.value,
          dob: form.victim_dob.value,
          address: form.victim_address.value,
          state: form.victim_state.value,
          district: form.victim_district.value,
          email: userEmail,
          mobile: form.victim_mobile.value
        },
        suspect: {
          phone: form.suspect_phone.value || null,
          email: form.suspect_email.value || null,
          social_handle: form.suspect_handle.value || null,
          bank_account: form.suspect_bank.value || null
        }
      };

      try {
        const res = await fetch("http://127.0.0.1:8000/complaint", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
          alert(`✅ ${result.message}\nComplaint ID: ${result.complaint_id || "N/A"}`);
          form.reset();
        } else {
          alert(result.detail || "Something went wrong!");
        }
      } catch (err) {
        console.error(err);
        alert("⚠️ Error submitting complaint. Try again later.");
      }
    });
  });
  </script>
</body>
</html>
