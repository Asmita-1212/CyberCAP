<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberCAP — My Complaints</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3b4ce2;
    --secondary: #6de1ff;
    --light: #ffffff;
    --muted: #6b7a99;
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    margin: 0;
    background: radial-gradient(circle at top right, #dce6ff, #f6f8ff 60%);
    color: #1f2a44;
    min-height: 100vh;
    padding-top: 90px;
  }

  /* Top Bar */
  .topbar {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(14px);
    width: 90%;
    max-width: 1200px;
    padding: 10px 25px;
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    z-index: 10;
  }

  .logo-section {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-section img {
    height: 38px;
    width: 38px;
    border-radius: 8px;
  }

  .logo-section h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    margin: 0;
  }

  .back-btn {
    background: linear-gradient(90deg, #ff6b6b, #ffa3a3);
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
  }

  .back-btn:hover {
    transform: translateY(-2px);
    opacity: 0.9;
  }

  /* Main container */
  .container {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
  }

  h2 {
    text-align: center;
    font-size: 2em;
    color: var(--primary);
    margin-bottom: 20px;
  }

  /* Search box */
  #searchInput {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 30px auto;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
  }

  #searchInput:focus {
    outline: none;
    box-shadow: 0 0 10px rgba(59,76,226,0.3);
  }

  /* Table styling */
  .table-wrapper {
    overflow-x: auto;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 12px;
  }

  thead th {
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    color: white;
    padding: 15px;
    border-radius: 8px;
    text-align: left;
    font-weight: 600;
  }

  tbody tr {
    background-color: rgba(255,255,255,0.9);
    border-radius: 8px;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  tbody tr:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  td {
    padding: 12px;
    vertical-align: middle;
  }

  .status-pending {
    color: #f39c12;
    font-weight: 600;
  }

  .status-resolved {
    color: #2ecc71;
    font-weight: 600;
  }

  /* Responsive */
  @media screen and (max-width: 768px) {
    table, thead, tbody, th, td, tr {
      display: block;
    }
    thead {
      display: none;
    }
    tbody tr {
      margin-bottom: 20px;
      padding: 15px;
    }
    td {
      text-align: right;
      padding-left: 50%;
      position: relative;
    }
    td::before {
      content: attr(data-label);
      position: absolute;
      left: 15px;
      width: 45%;
      font-weight: 600;
      text-align: left;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-section">
    <img src="logo.png" alt="CyberCAP Logo">
    <h1>CyberCAP | My Complaints</h1>
  </div>
  <a href="user_dashboard.html" class="back-btn">Back</a>
</div>

<div class="container">
  <h2>My Complaints</h2>
  <input type="text" id="searchInput" placeholder="Search complaints...">
  
  <div class="table-wrapper">
    <table id="complaintsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Incident Type</th>
          <th>Date</th>
          <th>Time</th>
          <th>Platform</th>
          <th>Description</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const userEmail = localStorage.getItem("email");
const apiURL = "http://localhost:8000/complaints";

async function loadComplaints() {
  try {
    const response = await fetch(apiURL);
    const data = await response.json();
    const userComplaints = data.filter(c => c.victim.email === userEmail);

    const tbody = document.querySelector("#complaintsTable tbody");
    tbody.innerHTML = "";

    userComplaints.forEach(complaint => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td data-label="ID">${complaint.complaint_id}</td>
        <td data-label="Incident Type">${complaint.incident_type}</td>
        <td data-label="Date">${
          complaint.incident_date
            ? new Date(complaint.incident_date).toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
              })
            : "N/A"
        }</td>
        <td data-label="Time">${complaint.incident_time}</td>
        <td data-label="Platform">${complaint.platform}</td>
        <td data-label="Description">${complaint.description}</td>
        <td data-label="Status" class="status-${complaint.status.toLowerCase()}">${complaint.status}</td>
      `;
      tr.addEventListener("click", () => {
        localStorage.setItem("selectedComplaintId", complaint.complaint_id);
        window.location.href = "complaints_detail.html";
      });
      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error("Error:", err);
    alert("Failed to load complaints.");
  }
}

document.getElementById("searchInput").addEventListener("keyup", function() {
  const filter = this.value.toLowerCase();
  const rows = document.querySelectorAll("#complaintsTable tbody tr");
  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
  });
});

loadComplaints();
</script>

</body>
</html>
