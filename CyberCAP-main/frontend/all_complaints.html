<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Complaints</title>
<style>
  /* Reset and global styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f6f8;
    color: #333;
    min-height: 100vh;
  }

  /* Container for full screen */
  .container {
    width: 95%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px 0;
  }

  /* Page title */
  h1 {
    text-align: center;
    font-size: 2.5em;
    color: #2c3e50;
    margin-bottom: 20px;
  }

  /* Search box */
  #searchInput {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 30px auto;
    padding: 12px 20px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 30px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
  }

  #searchInput:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
  }

  /* Table styling */
  .table-wrapper {
    overflow-x: auto;
    background-color: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 12px;
  }

  thead th {
    background-color: #3498db;
    color: white;
    padding: 15px;
    text-align: left;
   font-weight: bold;
    font-size: 16px;
  }

  tbody tr {
    background-color: #fdfdfd;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  tbody tr:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  td {
    padding: 12px;
    vertical-align: middle;
  }

  /* Status color coding */
  .status-pending {
    color: #e67e22;
    font-weight: bold;
  }

  .status-resolved {
    color: #27ae60;
    font-weight: bold;
  }

  /* Responsive */
  @media screen and (max-width: 768px) {
    table, thead, tbody, th, td, tr {
      display: block;
    }
    thead {
      display: none;
    }
    tbody tr {
      margin-bottom: 20px;
      padding: 15px;
      background-color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }
    td {
      text-align: right;
      padding-left: 50%;
      position: relative;
      border: none;
    }
    td::before {
      content: attr(data-label);
      position: absolute;
      left: 15px;
      width: 45%;
      font-weight: bold;
      text-align: left;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>My Complaints</h1>
  <input type="text" id="searchInput" placeholder="Search complaints...">
  
  <div class="table-wrapper">
    <table id="complaintsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Incident Type</th>
          <th>Date</th>
          <th>Time</th>
          <th>Platform</th>
          <th>Description</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Complaints inserted here -->
      </tbody>
    </table>
  </div>
</div>

<script>
const userEmail = localStorage.getItem("email");
const apiURL = "http://localhost:8000/complaints"; // replace with your backend

async function loadComplaints() {
  try {
    const response = await fetch(apiURL);
    const data = await response.json();
    const userComplaints = data.filter(c => c.victim.email === userEmail);

    const tbody = document.querySelector("#complaintsTable tbody");
    tbody.innerHTML = "";

    userComplaints.forEach(complaint => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td data-label="ID">${complaint.complaint_id}</td>
        <td data-label="Incident Type">${complaint.incident_type}</td>
        <td data-label="Date">${
          complaint.incident_date
            ? new Date(complaint.incident_date).toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
              })
            : "N/A"
        }</td>
        <td data-label="Time">${complaint.incident_time}</td>
        <td data-label="Platform">${complaint.platform}</td>
        <td data-label="Description">${complaint.description}</td>
        <td data-label="Status" class="status-${complaint.status.toLowerCase()}">${complaint.status}</td>
      `;

      // ✅ Make each row clickable
      tr.addEventListener("click", () => {
        localStorage.setItem("selectedComplaintId", complaint.complaint_id);
        console.log("Saved Complaint ID:", complaint.complaint_id);
        window.location.href = "complaints_detail.html"; // redirect to details page
      });

      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error("Error:", err);
    alert("Failed to load complaints.");
  }
}

// 🔍 Search/filter
document.getElementById("searchInput").addEventListener("keyup", function() {
  const filter = this.value.toLowerCase();
  const rows = document.querySelectorAll("#complaintsTable tbody tr");
  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
  });
});

loadComplaints();
</script>

</body>
</html>
