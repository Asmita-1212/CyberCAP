<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - CyberCAP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ✅ Navbar */
    .navbar {
      width: 100%;
      background: #1f3b73;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    .navbar .logo {
      font-size: 22px;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    .navbar ul li a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: color 0.3s;
    }

    .navbar ul li a:hover {
      color: #5edfff;
    }

    /* ✅ Login Box */
    .login-box {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      animation: fadeSlideDown 1s ease forwards;
      opacity: 0;
      transform: translateY(-30px);
      margin-top: 140px; /* To avoid overlap with navbar */
    }

    @keyframes fadeSlideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f3b73;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      border-color: #3e64ff;
      box-shadow: 0 0 8px rgba(62, 100, 255, 0.3);
      outline: none;
    }

    button {
      padding: 12px;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    button:hover {
      background-color: #2b4ae0;
    }

    button:active {
      transform: scale(0.97);
    }

    a {
      text-align: center;
      margin-top: 15px;
      color: #3e64ff;
      font-size: 14px;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #loginMessage {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }

    /* ✅ Responsive adjustments */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        text-align: center;
      }

      .navbar ul {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }

      .login-box {
        margin-top: 180px;
      }
    }
  </style>
</head>

<body>

  <!-- ✅ Persistent Navbar -->
  <nav class="navbar">
   <a href="index.html" class="logo">
      <img src="logo.png" alt="CyberCAP Logo">
      <span>CyberCAP</span>
    <ul>
      <li><a href="dashboard.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="cybervoluteer.html"><i class="fas fa-users"></i> Cyber Volunteers</a></li>
      <li><a href="learncorner.html"><i class="fas fa-book"></i> Learning Corner</a></li>
      <li><a href="contactus.html"><i class="fas fa-envelope"></i> Contact Us</a></li>
    </ul>
  </nav>

  <!-- ✅ Admin Login Form -->
  <div class="login-box">
    <h2>Admin Login</h2>

    <p id="loginMessage"></p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required placeholder="Enter your username"/>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Enter your password"/>

      <button type="submit">Login</button>

      <a href="forgot_password.html">Forgot Password?</a>
    </form>
  </div>

  <!-- ✅ JS Script -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const messageEl = document.getElementById("loginMessage");

      if (!username || !password) {
        messageEl.style.color = "red";
        messageEl.innerText = "Please enter both username and password.";
        messageEl.style.display = "block";
        return;
      }

      try {
        const response = await fetch("http://127.0.0.1:8000/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok && data.message?.includes("Password verified")) {
          messageEl.style.color = "green";
          messageEl.innerText = "✅ Login successful! Redirecting...";
          messageEl.style.display = "block";

          localStorage.setItem("adminUsername", username);

          setTimeout(() => {
            window.location.href = "admin_otp.html";
          }, 1000);
        } else {
          messageEl.style.color = "red";
          messageEl.innerText = data.detail || "❌ Invalid Username or Password!";
          messageEl.style.display = "block";
        }
      } catch (error) {
        console.error(error);
        messageEl.style.color = "red";
        messageEl.innerText = "⚠️ Error connecting to server.";
        messageEl.style.display = "block";
      }
    });
  </script>

</body>
</html>
