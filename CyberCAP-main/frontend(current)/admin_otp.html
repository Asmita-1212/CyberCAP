<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin OTP Verification - CyberCAP</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      height:100vh;
      background:linear-gradient(135deg,#3e64ff,#5edfff);
      display:flex; justify-content:center; align-items:center; overflow:hidden;
    }
    .otp-box {
      background:#fff; padding:40px 30px; border-radius:12px; 
      box-shadow:0 12px 24px rgba(0,0,0,0.1); width:100%; max-width:400px;
      animation:fadeSlideDown 1s ease forwards; opacity:0; transform:translateY(-30px);
    }
    @keyframes fadeSlideDown { to { opacity:1; transform:translateY(0);} }
    h2 { text-align:center; margin-bottom:25px; color:#1f3b73; animation:fadeIn 1.5s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    form { display:flex; flex-direction:column; }
    label { margin-bottom:5px; font-weight:600; color:#333; }
    input[type="text"] {
      padding:12px; margin-bottom:20px; border:1px solid #ccc; border-radius:8px;
      transition:border-color .3s, box-shadow .3s; font-size:14px;
    }
    input:focus { border-color:#3e64ff; box-shadow:0 0 8px rgba(62,100,255,.3); outline:none; }
    button {
      padding:12px; background:#3e64ff; color:#fff; border:none; border-radius:8px;
      font-size:16px; cursor:pointer; transition:background-color .3s, transform .1s;
    }
    button:hover { background:#2b4ae0; }
    button:active { transform:scale(0.97); }
    #otpMessage { text-align:center; margin-bottom:15px; font-size:14px; display:none; }
  </style>
</head>
<body>
  <div class="otp-box">
    <h2>Enter OTP</h2>
    <p id="otpMessage"></p>

    <form id="otpForm">
      <label for="otp">One-Time Password</label>
      <input type="text" id="otp" name="otp" required placeholder="Enter the OTP sent to you"/>
      <button type="submit">Verify OTP</button>
    </form>
  </div>

  <script>
    document.getElementById("otpForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const otp = document.getElementById("otp").value;
      const messageEl = document.getElementById("otpMessage");
      const username = localStorage.getItem("adminUser"); // must match login page key

      if (!username) {
        messageEl.style.color = "red";
        messageEl.innerText = "⚠️ Username not found. Please login again.";
        messageEl.style.display = "block";
        return;
      }

      try {
        const res = await fetch("http://127.0.0.1:8000/admin-mfa", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, otp })
        });

        const data = await res.json();
        messageEl.style.display = "block";

        if (res.ok && data.message && data.message.toLowerCase().includes("successful")) {
          messageEl.style.color = "green";
          messageEl.innerText = "✅ OTP verified successfully! Redirecting...";
          setTimeout(() => { window.location.href = "admin_dashboard.html"; }, 900);
        } else {
          messageEl.style.color = "red";
          messageEl.innerText = data.message || "❌ Invalid OTP. Try again.";
        }
      } catch (err) {
        console.error(err);
        messageEl.style.color = "red";
        messageEl.innerText = "⚠️ Error connecting to server.";
      }
    });
  </script>
</body>
</html>
