<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Volunteer Registration | CyberCAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    /* Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #4ca1af, #56c5f8);
      padding: 0;
      margin: 0;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      padding: 10px 40px;
      border-bottom: 2px solid cyan;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .navbar .logo img {
      height: 40px;
      width: auto;
      border-radius: 40px;
      margin-right: 10px; /* space between logo and text */
      filter: drop-shadow(0 0 3px cyan);
    }

    .navbar .logo span {
      color: #00eaff;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    .navbar ul li a {
      text-decoration: none;
      color: #f0f0f0;
      font-weight: 500;
      transition: 0.3s;
    }

    .navbar ul li a:hover {
      color: cyan;
    }

    /* Container */
    .container {
      max-width: 750px;
      margin: 50px auto;
      background: white;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    h1::before {
      content: "🛡️ ";
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2196f3;
      box-shadow: 0 0 5px rgba(33, 150, 243, 0.3);
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      background: linear-gradient(to right, #2196f3, #1e88e5);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #1e88e5, #1565c0);
    }

    .note {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        padding: 10px 20px;
        text-align: center;
      }

      .navbar ul {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }

      .container {
        padding: 25px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="CyberCAP Logo">
      <span>CyberCAP</span>
    </a>
    <ul>
      <li><a href="dashboard.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="cybervoluteer.html"><i class="fas fa-users"></i> Volunteers</a></li>
      <li><a href="learncorner.html"><i class="fas fa-book"></i> Learning</a></li>
      <li><a href="user_login.html"><i class="fas fa-user"></i> User Login</a></li>
      <li><a href="contactus.html"><i class="fas fa-envelope"></i> Contact</a></li>
    </ul>
  </nav>

  <!-- Volunteer Registration Form -->
  <div class="container">
    <h1>Cyber Volunteer Registration</h1>
    <p>Join hands with the Government to identify harmful and unlawful content online.</p>

    <form>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email">

      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" required placeholder="Enter your phone number">

      <label for="role">Select Role:</label>
      <select id="role" name="role" required>
        <option value="">-- Choose Role --</option>
        <option value="volunteer">Cyber Volunteer</option>
        <option value="expert">Cyber Expert</option>
        <option value="organization">Cyber Awareness Organization</option>
      </select>

      <label for="state">State/UT:</label>
      <input type="text" id="state" name="state" required placeholder="Enter your State or Union Territory">

      <label for="expertise">Area of Expertise (Optional):</label>
      <input type="text" id="expertise" name="expertise" placeholder="e.g., Cyber Security, Law, IT, Education">

      <label for="message">Why do you want to join?</label>
      <textarea id="message" name="message" required placeholder="Write a short message explaining your motivation."></textarea>

      <button type="submit">Register as Volunteer</button>
    </form>
  </div>

</body>
</html>
