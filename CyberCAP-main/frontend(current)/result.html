<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Complaint Result - CyberCap</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      text-align: center;
      color: #2c3e50;
    }

    .result-container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      margin-bottom: 25px;
    }

    .result-detail {
      font-size: 18px;
      margin: 15px 0;
    }

    .priority-high {
      color: #e74c3c;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .priority-medium {
      color: #f39c12;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .priority-low {
      color: #27ae60;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .btn-group {
      margin-top: 30px;
    }

    a.button {
      background-color: #3498db;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      margin: 0 10px;
      display: inline-block;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #2980b9;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }
      .result-container {
        padding: 20px;
      }
      .result-detail {
        font-size: 16px;
      }
      a.button {
        padding: 10px 20px;
        margin: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="result-container">
    <h1>Complaint Classification Result</h1>

    <div class="result-detail">
      <strong>Category:</strong> {{ result.category }}
    </div>
    <div class="result-detail">
      <strong>Priority:</strong>
      {% if result.priority == "High" %}
        <span class="priority-high">{{ result.priority }}</span>
      {% elif result.priority == "Medium" %}
        <span class="priority-medium">{{ result.priority }}</span>
      {% else %}
        <span class="priority-low">{{ result.priority }}</span>
      {% endif %}
    </div>

    <div class="btn-group">
      <a href="index.html" class="button">Submit Another Complaint</a>
      <a href="dashboard.html" class="button">Go to Dashboard</a>
    </div>
  </div>
</body>
</html>
