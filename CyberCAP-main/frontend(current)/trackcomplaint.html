<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Your Cybercrime Complaint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ========== NAVBAR ========== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #000000, #0b0c10);
      padding: 12px 50px;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar .logo {
      font-size: 1.6em;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }

    .navbar .logo img {
      height: 45px;
      width: auto;
      vertical-align: middle;
      filter: drop-shadow(0 0 4px cyan);
      border-radius: 50%;
      margin-right: 10px;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

  .navbar ul li a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s, border-bottom 0.3s;
  padding-bottom: 4px;
  display: inline-block;
  border-bottom: none;
}

.navbar ul li a:hover {
  color: #eaf1f3; /* light blue on hover */
}

.navbar ul li a.active {
  color: #d7e3e7; /* highlight active page */
  border-bottom: 2px solid #00bfff;
}


    /* ========== PAGE STYLING ========== */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #5fa8f1;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-3px);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button[type="submit"] {
      margin-top: 30px;
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    #result {
      margin-top: 30px;
      display: none;
      background-color: #f8f9fa;
      border: 1px solid #d1ecf1;
      padding: 18px;
      border-radius: 6px;
      color: #0c5460;
      transition: all 0.3s ease;
    }

    .status-box {
      background-color: #e9f7ef;
      color: #155724;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-weight: bold;
      border: 1px solid #c3e6cb;
    }

    .loading {
      text-align: center;
      margin-top: 20px;
      display: none;
      color: #007bff;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 10px;
      }
      .navbar ul {
        flex-direction: column;
        align-items: center;
      }
    }
    
  </style>
</head>
<body>

  <!-- ✅ Navbar Section -->
  <nav class="navbar">
    <a href="#" class="logo"><img src="logo.png">CyberCAP</a>
    <ul>
      <a href="home.html">Home</a>
      <a href="complaint.html">Register Complaint</a>
      <a href="trackcomplaint.html">Track Complaint</a>
      <a href="reportsuspect.html" class="active">Report Suspect</a>
    </ul>
  </nav>

  <!-- ✅ Complaint Tracker -->
  <div class="container">
    <h2>🔍 Track Your Complaint</h2>

    <form id="trackForm">
      <label for="complaintId">Complaint ID:</label>
      <input type="text" id="complaintId" name="complaintId" required placeholder="Enter your Complaint ID">

      <label for="mobile">Registered Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" required placeholder="Enter your mobile number">

      <button type="submit">Track Complaint</button>
    </form>

    <div class="loading" id="loading">Fetching your complaint status...</div>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById('trackForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const result = document.getElementById('result');
      result.style.display = 'none';
      const loading = document.getElementById('loading');
      loading.style.display = 'block';

      const complaintId = document.getElementById('complaintId').value.trim();
      const mobile = document.getElementById('mobile').value.trim();

      try {
        const response = await fetch("http://127.0.0.1:8000/track_complaint", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ complaintId, mobile })
        });

        loading.style.display = 'none';

        if (!response.ok) {
          const error = await response.json();
          result.innerHTML = `<div class="status-box" style="background-color:#f8d7da;color:#721c24;border:1px solid #f5c6cb;">
            ❌ Error: ${error.detail || "Complaint not found or invalid details."}
          </div>`;
          result.style.display = 'block';
          return;
        }

        const data = await response.json();

        result.innerHTML = `
          <div class="status-box">
            📄 <strong>Status:</strong> ${data.status}
          </div>
          <strong>Complaint ID:</strong> ${data.complaint_id}<br>
          <strong>Incident Type:</strong> ${data.incident_type}<br>
          <strong>Date:</strong> ${data.incident_date}<br>
          <strong>Platform:</strong> ${data.platform}<br>
          <strong>Description:</strong> ${data.description}<br><br>
          <em>For any updates, please check again later or contact your nearest cybercrime cell.</em>
        `;
        result.style.display = 'block';

      } catch (err) {
        loading.style.display = 'none';
        result.innerHTML = `<div class="status-box" style="background-color:#fff3cd;color:#856404;border:1px solid #ffeeba;">
          ⚠️ Error connecting to server: ${err.message}
        </div>`;
        result.style.display = 'block';
      }
    });
  </script>

</body>
</html>
