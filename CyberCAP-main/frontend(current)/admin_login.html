<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | CyberCAP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f5f6fa;
    }

    /* Navbar same as dashboard */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #1f2833;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 25px;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .navbar .left-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .navbar-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .navbar .right-section {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .navbar .right-section i {
      font-size: 20px;
      cursor: pointer;
      color: #66fcf1;
      transition: 0.3s;
    }

    .navbar .right-section i:hover {
      color: #00bcd4;
      transform: scale(1.15);
    }

    /* Centered Login Box */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #48485c;
    }

    .login-box {
      background: white;
      padding: 40px 50px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }

    .login-box h2 {
      color: #1f2833;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
    }

    .login-btn {
      width: 100%;
      background-color: #3366ff;
      border: none;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background-color: #2554d4;
      transform: scale(1.03);
    }

    @media (max-width: 480px) {
      .login-box {
        width: 90%;
        padding: 30px 25px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="left-section">
      <span class="navbar-title">CyberCAP </span>
    </div>
    <div class="right-section">
      <i class="fas fa-home" title="Home" onclick="window.location.href='admin_login.html'"></i>
    </div>
  </div>

  <!-- Login Section -->
  <div class="login-container">
    <div class="login-box">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://127.0.0.1:8000/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) throw new Error("Login failed");
        const data = await res.json();

        alert("✅ Login successful!");
        localStorage.setItem("adminUser", username);
        window.location.href = "admin_dashboard.html";
      } catch (err) {
        alert("❌ Invalid credentials. Try again.");
      }
    });
  </script>
</body>
</html>
