<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - CyberCAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #3e64ff, #5edfff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f3b73;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    input[type="email"],
    input[type="text"],
    input[type="password"] {
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      border-color: #3e64ff;
      box-shadow: 0 0 8px rgba(62, 100, 255, 0.2);
      outline: none;
    }

    button {
      padding: 12px;
      background-color: #3e64ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #2b4ae0;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #333;
      min-height: 20px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 20px;
      }

      input, button {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Forgot Password</h2>

    <!-- Step 1: Enter Email -->
    <form id="forgotForm">
      <label for="email">Enter your registered Email:</label>
      <input type="email" id="email" name="email" required placeholder="e.g. you@example.com" />
      <button type="submit">Send OTP</button>
    </form>

    <!-- Step 2: Enter OTP & New Password -->
    <form id="resetForm" style="display: none;">
      <label for="otp">Enter OTP:</label>
      <input type="text" id="otp" name="otp" required placeholder="Enter OTP here" />

      <label for="newPassword">Enter New Password:</label>
      <input type="password" id="newPassword" name="newPassword" required placeholder="New secure password" />

      <button type="submit">Reset Password</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    let userEmail = "";

    // Step 1: Send OTP
    document.getElementById("forgotForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      userEmail = document.getElementById("email").value;
      const messageEl = document.getElementById("message");

      try {
        const response = await fetch("http://127.0.0.1:8000/send-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: userEmail })
        });

        const data = await response.json();

        if (response.ok) {
          messageEl.style.color = "green";
          messageEl.innerText = "✅ OTP sent to your email!";
          document.getElementById("forgotForm").style.display = "none";
          document.getElementById("resetForm").style.display = "flex";
        } else {
          messageEl.style.color = "red";
          messageEl.innerText = "❌ " + data.detail;
        }
      } catch (error) {
        messageEl.style.color = "red";
        messageEl.innerText = "⚠️ Error connecting to server.";
      }
    });

    // Step 2: Reset Password
    document.getElementById("resetForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const otp = document.getElementById("otp").value;
      const newPassword = document.getElementById("newPassword").value;
      const messageEl = document.getElementById("message");

      try {
        const response = await fetch("http://127.0.0.1:8000/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: userEmail, otp, new_password: newPassword })
        });

        const data = await response.json();

        if (response.ok) {
          messageEl.style.color = "green";
          messageEl.innerText = "✅ " + data.message + " You can now login.";
          document.getElementById("resetForm").reset();

          // Redirect to login page after 2 seconds
          setTimeout(() => {
            window.location.href = "login.html"; // Change this to your login page path
          }, 2000);
        } else {
          messageEl.style.color = "red";
          messageEl.innerText = "❌ " + data.detail;
        }
      } catch (error) {
        messageEl.style.color = "red";
        messageEl.innerText = "⚠️ Error connecting to server.";
      }
    });
  </script>
</body>
</html>
