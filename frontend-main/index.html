<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCap - Complaint Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        form {
            margin: 20px auto;
            width: 60%;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 95%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            resize: none;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #ecf0f1;
            display: inline-block;
        }
        .priority-high { color: red; font-weight: bold; }
        .priority-medium { color: orange; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🚔 CyberCap - Cyber Complaint Classifier</h1>
    <form method="POST">
        <textarea name="complaint" placeholder="Enter your cyber complaint here..." required></textarea><br>
        <button type="submit">Classify Complaint</button>
    </form>

    {% if result %}
    <div class="result">
        <p><strong>Category:</strong> {{ result.category }}</p>
        <p><strong>Priority:</strong> 
            {% if result.priority == "High" %}
                <span class="priority-high">{{ result.priority }}</span>
            {% else %}
                <span class="priority-medium">{{ result.priority }}</span>
            {% endif %}
        </p>
    </div>
    {% endif %}
</body>
</html>
